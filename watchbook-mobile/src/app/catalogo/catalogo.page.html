<app-header pageTitle="Catálogo"></app-header>

<ion-content [fullscreen]="true">
  
  <!-- Barra de Pesquisa -->
  <div class="search-container">
    <ion-searchbar 
      [(ngModel)]="termo_busca"
      (keyup.enter)="buscarObra()"
      (ionClear)="limparBusca()"
      placeholder="Buscar obras por título..."
      animated="true"
      show-clear-button="focus">
    </ion-searchbar>
    <ion-button 
      (click)="buscarObra()" 
      color="primary"
      class="btn-pesquisar">
      <ion-icon slot="start" name="search-outline"></ion-icon>
      Buscar
    </ion-button>
  </div>

  <!-- Filtros por tipo -->
  <app-tipo-filter 
    [(value)]="tipo_filtro"
    (valueChange)="filtrarPorTipo($event)">
  </app-tipo-filter>

  <!-- Grid de Obras -->
  <ion-grid class="ion-padding">
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let obra of lista_obras">
        <ion-card class="obra-card">
          <ion-row class="ion-no-padding">
            <ion-col size="4" class="ion-no-padding">
              <ion-thumbnail class="poster-thumbnail">
                <img 
                  [src]="obterUrlPoster(obra.poster)" 
                  [alt]="'Poster de ' + obra.titulo"
                  (error)="$any($event.target).src='assets/placeholder-poster.png'"/>
              </ion-thumbnail>
            </ion-col>
            <ion-col size="8">
              <ion-card-header>
                <div class="titulo-row">
                  <ion-card-title class="obra-titulo">{{ obra.titulo }}</ion-card-title>
                  <ion-button 
                    fill="clear" 
                    size="small" 
                    color="success"
                    (click)="abrirModalAdicionar(obra)"
                    class="btn-adicionar">
                    <ion-icon slot="icon-only" name="add-circle"></ion-icon>
                  </ion-button>
                </div>
                <ion-card-subtitle>
                  <ion-icon name="calendar-outline" size="small"></ion-icon>
                  {{ obra.ano_lancamento }}
                </ion-card-subtitle>
                <ion-card-subtitle *ngIf="obra.diretor">
                  <ion-icon name="person-outline" size="small"></ion-icon>
                  {{ obra.diretor }}
                </ion-card-subtitle>
              </ion-card-header>

              <ion-card-content>
                <ion-badge color="primary">{{ obra.genero }}</ion-badge>
                <ion-badge color="secondary" class="ion-margin-start">
                  {{ obra.tipo_display }}
                </ion-badge>
              </ion-card-content>
            </ion-col>
          </ion-row>
        </ion-card>
      </ion-col>
    </ion-row>

    <!-- Mensagem quando não há obras -->
    <ion-row *ngIf="lista_obras.length === 0">
      <ion-col size="12">
        <ion-card>
          <ion-card-content class="ion-text-center">
            <ion-icon name="film-outline" size="large" color="medium"></ion-icon>
            <p>
              <ion-text color="medium">
                <strong>Nenhuma obra encontrada</strong>
              </ion-text>
            </p>
            <p *ngIf="termo_busca">
              <ion-text color="medium">
                <small>Tente buscar por outro termo</small>
              </ion-text>
            </p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>

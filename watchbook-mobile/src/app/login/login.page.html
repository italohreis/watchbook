<!-- app header -->
<app-header pageTitle="Login"></app-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="login-container">
    <ion-card class="login-card">
      <ion-card-header>
        <ion-card-title class="ion-text-center">Login</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <form (submit)="autenticarUsuario()">
          <div class="form-group">
            <ion-label>Usuário</ion-label>
            <ion-item lines="none">
              <ion-input type="text" placeholder="Digite seu Usuário" [(ngModel)]="instancia.username"
                name="username"></ion-input>
            </ion-item>
          </div>

          <div class="form-group">
            <ion-label>Senha</ion-label>
            <ion-item lines="none">
              <ion-input type="password" placeholder="Digite sua senha" [(ngModel)]="instancia.password"
                name="password"></ion-input>
            </ion-item>
          </div>

          <ion-button expand="block" type="submit">
            Entrar
          </ion-button>

          <!-- Link para Cadastro -->
          <div class="ion-text-center ion-margin-top">
            <ion-text color="medium">
              <small>
                Não tem uma conta?
                <a routerLink="/cadastro" class="link-cadastro">Cadastre-se</a>
              </small>
            </ion-text>
          </div>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
